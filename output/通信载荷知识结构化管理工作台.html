<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通信载荷知识结构化管理工作台</title>
<style>
:root{
 --bg:#0B1220; --panel:#101A2C; --panel2:#0D1626; --line:#1E2A3F; --line2:#2A3A55;
 --txt:#D7E3F4; --dim:#7C8DA6; --dim2:#54637A;
 --cyan:#38BDF8; --cyan2:#7DD3FC; --green:#34D399; --amber:#FBBF24; --red:#F87171; --violet:#A78BFA; --orange:#FB923C; --blue:#60A5FA;
 --cat0:#38BDF8; --cat1:#60A5FA; --cat2:#94A3B8; --cat3:#FBBF24; --cat4:#34D399; --cat5:#A78BFA; --cat6:#FB923C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:13px/1.55 "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#243449;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;flex-direction:column;height:100%}
/* ---------- toolbar ---------- */
#toolbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;background:linear-gradient(180deg,#12203A,#0E1930);border-bottom:1px solid var(--line);flex-shrink:0}
#toolbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.4px;white-space:nowrap}
#toolbar .logo .cube{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--cyan),#2563EB);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#04121F;font-weight:900}
.tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{padding:4px 12px;border-radius:6px;font-size:12px;color:var(--dim);white-space:nowrap}
.tabs button.on{background:#17304F;color:var(--cyan2);box-shadow:inset 0 0 0 1px #2B4A73}
.tabs button:hover:not(.on){color:var(--txt)}
#search{width:190px}
.spacer{flex:1}
.tbtn{padding:5px 11px;border:1px solid var(--line2);border-radius:7px;font-size:12px;color:var(--dim);background:var(--panel2);white-space:nowrap}
.tbtn:hover{color:var(--txt);border-color:var(--cyan)}
.tbtn.pri{color:var(--cyan2);border-color:#2B4A73}
/* ---------- topbar（元信息 + 本地/远程操作） ---------- */
#topbar{display:flex;align-items:center;gap:9px;height:34px;padding:0 12px;background:var(--panel2);border-bottom:1px solid var(--line);flex-shrink:0;font-size:11px;overflow:hidden}
#topbar .mgrp{display:flex;align-items:center;gap:9px;flex-shrink:0}
#topbar .mgrp label{display:flex;align-items:center;gap:4px;color:var(--dim2);font-family:Consolas,monospace;font-size:10px;white-space:nowrap}
#topbar .mgrp input{width:104px;padding:2px 6px;font-size:11px}
#ctxWarn{color:var(--amber);font-size:10px;font-family:Consolas,monospace;white-space:nowrap}
.btngrp{display:flex;align-items:center;gap:5px;flex-shrink:0}
.btngrp>i{font-style:normal;font-size:9px;font-family:Consolas,monospace;color:var(--dim2);margin-right:2px;white-space:nowrap}
.vsep{width:1px;height:17px;background:var(--line);flex-shrink:0}
.obtn{padding:3px 9px;border:1px solid var(--line2);border-radius:5px;font-size:11px;color:var(--dim);background:var(--panel2);white-space:nowrap}
.obtn:hover:not(:disabled){color:var(--cyan2);border-color:var(--cyan)}
.obtn.on{color:var(--green);border-color:#1F6B4A;background:#123024}
.obtn:disabled{opacity:.42;cursor:not-allowed}
#mBase{width:122px;padding:2px 6px;font-size:10.5px;font-family:Consolas,monospace}
#syncSt{font-family:Consolas,monospace;font-size:10px;color:var(--dim2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
#syncSt.ok{color:var(--green)}
#syncSt.busy{color:var(--amber)}
#syncSt.off{color:var(--dim2)}
@keyframes sp{to{transform:rotate(360deg)}}
#syncSt .spi{display:inline-block;animation:sp .9s linear infinite}
/* ---------- PATH 面包屑 ---------- */
#pathBox{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;font-size:11px;color:var(--dim)}
#pathBox>i{font-style:normal;font-family:Consolas,monospace;font-size:9px;letter-spacing:.7px;color:var(--dim2)}
#pathTxt{display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
#pathTxt em{font-style:normal;color:var(--dim2);padding:0 4px}
#pathTxt .cur{color:var(--cyan2);font-weight:600}
/* ---------- 视图浮层：图例 / 缩放 / 联动指示 / pill ---------- */
.pill{padding:3px 10px;border:1px solid var(--line2);border-radius:20px;font-size:11px;color:var(--dim);background:#0E1930;white-space:nowrap}
.pill:hover{color:var(--txt);border-color:var(--cyan)}
.pill.on{color:var(--cyan2);border-color:#2B4A73;background:#153049}
.pill.on.a{color:var(--amber);border-color:#7A5B18;background:#2A2312}
.pill.on.c{color:#67E8F9;border-color:#155E6B;background:#0E2C33}
#legend{position:absolute;left:12px;bottom:44px;display:none;gap:10px;align-items:center;flex-wrap:wrap;max-width:64%;background:#0B1220CC;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:10.5px;color:var(--dim);pointer-events:none;z-index:12}
#legend .lg-i{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#legend .lg-i i{width:9px;height:9px;border-radius:50%;display:inline-block}
#legend .lg-i i.sq{border-radius:2px;border:1px solid #F59E0B}
#legend .lg-i i.ln{width:16px;height:2px;border-radius:1px}
#zoomBox{position:absolute;right:12px;bottom:12px;display:none;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0E1930E8;z-index:12}
#zoomBox button{width:28px;height:26px;color:var(--dim);font-size:13px;line-height:1;border-bottom:1px solid var(--line)}
#zoomBox button:last-child{border-bottom:none}
#zoomBox button:hover{color:var(--cyan2);background:#17304F}
#linkInd{position:absolute;left:12px;top:10px;font-size:10.5px;font-family:Consolas,monospace;color:var(--dim2);background:#0B1220B8;border:1px solid var(--line);border-radius:6px;padding:3px 9px;pointer-events:none;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:12}
#linkInd b{color:var(--cyan2)}
/* ---------- layout ---------- */
#main{display:flex;flex:1;min-height:0}
#left{width:288px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#center{flex:1;min-width:0;position:relative;background:
 radial-gradient(1200px 600px at 70% -10%,#12233C 0%,transparent 60%),var(--bg)}
#right{width:392px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.pane-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);flex-shrink:0}
.pane-h b{color:var(--txt);font-size:12.5px}
.pane-h .cnt{margin-left:auto;font-family:Consolas,monospace;font-size:11px;color:var(--dim2)}
.scroll{overflow:auto;flex:1;min-height:0}
/* ---------- tree ---------- */
.tnode{user-select:none}
.trow{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 0;cursor:pointer;border-left:2px solid transparent}
.trow:hover{background:#152238}
.trow.sel{background:#14283F;border-left-color:var(--cyan)}
.trow .car{width:14px;height:14px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:var(--dim2);font-size:9px;transition:transform .12s}
.trow .car.open{transform:rotate(90deg)}
.trow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.trow .bdg{font-size:10px;color:var(--dim2);border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-family:Consolas,monospace}
.trow .ops{display:none;gap:2px}
.trow:hover .ops{display:flex}
.ops button{width:19px;height:19px;border-radius:4px;color:var(--dim);font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.ops button:hover{background:#1D3049;color:var(--cyan2)}
.trow.hit .nm{color:var(--amber)}
/* ---------- center views ---------- */
#viewWrap{position:absolute;inset:0}
canvas.view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas.view:active{cursor:grabbing}
#viewHint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--dim2);pointer-events:none;background:#0B1220B8;padding:3px 9px;border-radius:6px;border:1px solid var(--line)}
#viewTools{position:absolute;right:12px;top:10px;display:flex;gap:6px;align-items:center}
#viewTools select,#viewTools button{font-size:11px;padding:3px 9px}
#tooltip{position:absolute;pointer-events:none;background:#0E1B2EF2;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:11.5px;max-width:330px;display:none;z-index:30;box-shadow:0 8px 24px #0008}
#tooltip .tt{font-weight:700;font-size:12.5px;margin-bottom:3px}
#tooltip .td{color:var(--dim);margin-bottom:3px}
#tooltip .tm{font-family:Consolas,monospace;color:var(--cyan2);font-size:10.5px}
/* chain view */
#chainView{position:absolute;inset:0;overflow:auto;padding:16px 18px 46px}
.cvgrp{margin-bottom:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.cvgrp>h4{padding:8px 13px;font-size:12.5px;background:var(--panel2);border-bottom:1px solid var(--line);color:var(--cyan2)}
.cvitem{padding:10px 13px;border-bottom:1px solid var(--line)}
.cvitem:last-child{border-bottom:none}
.cvitem .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.cvitem .h b{font-size:13px}
.cvitem .h .cat{font-size:10px;border-radius:4px;padding:0 6px;background:#17304F;color:var(--cyan2)}
.cvitem .h .cid{margin-left:auto;font-family:Consolas,monospace;font-size:10.5px;color:var(--dim2)}
.cvitem .d{font-size:11.5px;color:var(--dim);margin-bottom:7px}
.crow2{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin:4px 0}
.uchip{border:1px solid var(--line2);border-left:3px solid var(--c,#94A3B8);border-radius:6px;background:var(--panel2);padding:3px 9px;font-size:11.5px;cursor:pointer}
.uchip:hover{border-color:var(--cyan)}
.uchip i{display:block;font-style:normal;font-family:Consolas,monospace;font-size:9px;color:var(--dim2)}
.carr{color:var(--dim2);font-size:12px;padding:0 2px}
/* dsm */
#dsmView{position:absolute;inset:0;overflow:auto;padding:14px 14px 46px}
#dsmView table{border-collapse:collapse;font-size:10px}
#dsmView th{position:sticky;top:0;background:var(--panel);z-index:2}
#dsmView th.rl{position:sticky;left:0;background:var(--panel);z-index:3;text-align:right;padding:1px 7px 1px 0;font-weight:400;color:var(--dim);white-space:nowrap;font-size:10.5px}
#dsmView th.cl{height:88px;vertical-align:bottom;padding:0}
#dsmView th.cl>div{transform:rotate(-58deg);transform-origin:left bottom;white-space:nowrap;color:var(--dim);font-weight:400;font-size:10.5px;width:16px}
#dsmView td{width:17px;height:17px;border:1px solid #101A2C;text-align:center;font-size:9px;cursor:default}
#dsmView td.mk{cursor:pointer}
/* ---------- right panel ---------- */
#detail{padding:12px 13px;display:flex;flex-direction:column;gap:11px}
.dtitle{display:flex;align-items:flex-start;gap:8px}
.dtitle h3{font-size:15px;line-height:1.3;flex:1}
.catbadge{font-size:10.5px;border-radius:5px;padding:1px 8px;white-space:nowrap;margin-top:2px}
.dpath{font-size:10.5px;color:var(--dim2);font-family:Consolas,monospace;word-break:break-all}
.ddesc{font-size:12px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sect{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sect>h5{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.sect>h5 .n{margin-left:auto;font-family:Consolas,monospace;color:var(--dim2);font-size:10.5px}
.sect>h5 button{margin-left:6px;font-size:11px;color:var(--cyan2);border:1px solid #2B4A73;border-radius:5px;padding:0 7px}
.sect .body{padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.arow{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#0E1728;cursor:pointer}
.arow:hover{border-color:var(--line2)}
.arow .l1{display:flex;align-items:center;gap:7px}
.arow .l1 b{font-size:12.5px;flex:1}
.arow .sym{font-family:Consolas,monospace;font-size:11px;color:var(--cyan2);background:#12283F;border-radius:4px;padding:0 6px}
.arow .l2{font-size:11px;color:var(--dim);margin-top:2px}
.arow .ops2{display:flex;gap:4px}
.ops2 button{font-size:10.5px;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 6px}
.ops2 button:hover{color:var(--cyan2);border-color:var(--cyan)}
.ccard{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:7px;padding:7px 9px;background:#151321}
.ccard .f{font-family:Consolas,monospace;font-size:11.5px;color:var(--amber);word-break:break-all}
.ccard .d{font-size:11px;color:var(--dim);margin:3px 0 5px}
.mchips{display:flex;flex-wrap:wrap;gap:4px}
.mchip{font-size:10.5px;border-radius:5px;padding:1px 7px;background:#1D2A41;border:1px solid var(--line2);cursor:pointer}
.mchip:hover{border-color:var(--cyan)}
.mchip .r{color:var(--cyan2);font-family:Consolas,monospace}
.kv{display:flex;gap:8px;font-size:11.5px}
.kv .k{color:var(--dim2);flex-shrink:0;width:64px}
.empty{color:var(--dim2);font-size:11.5px;padding:6px 2px}
/* ---------- footer ---------- */
#status{display:flex;align-items:center;gap:12px;height:26px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font-size:10.5px;color:var(--dim);font-family:Consolas,monospace;flex-shrink:0}
#status .g{color:var(--green)}
#status b{color:var(--cyan2)}
#status .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- modal ---------- */
#mask{position:fixed;inset:0;background:#04070CB0;display:none;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:6vh 16px}
#mask.on{display:flex}
.modal{width:640px;max-width:96vw;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 70px #000C;overflow:hidden}
.modal h4{padding:11px 15px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:9px}
.modal h4 .x{margin-left:auto;color:var(--dim);font-size:16px;line-height:1}
.modal .mb{padding:14px 15px;display:flex;flex-direction:column;gap:11px}
.modal .mf{padding:10px 15px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--panel2)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;color:var(--dim)}
.fld .r2{display:flex;gap:8px}
.fld .r2>*{flex:1}
.btn{padding:6px 15px;border-radius:7px;font-size:12.5px;border:1px solid var(--line2);color:var(--dim)}
.btn:hover{color:var(--txt)}
.btn.pri{background:#155E93;border-color:#2B7FBF;color:#EAF6FF}
.btn.danger{color:var(--red);border-color:#7F1D1D}
.mrow{display:flex;gap:7px;align-items:center}
.mrow select{flex:1}
.mrow input{width:110px}
.mrow button{color:var(--red);font-size:14px;width:24px}
.toast{position:fixed;right:18px;bottom:18px;background:#12304A;border:1px solid #2B4A73;color:var(--cyan2);border-radius:8px;padding:8px 15px;font-size:12.5px;z-index:99;display:none;box-shadow:0 10px 30px #0009;max-width:58vw}
.toast.ok{background:#12291F;border-color:#1F6B4A;color:var(--green)}
.toast.err{background:#2A1B12;border-color:#7A4A18;color:var(--amber)}
</style>
</head>
<body>
<div id="app">
 <div id="topbar">
  <span class="mgrp">
   <label>用户名<input id="mUser" placeholder="请输入用户名"></label>
   <label>项目名<input id="mProj" placeholder="请输入项目名"></label>
   <label>文件名<input id="mFile" placeholder="请输入文件名"></label>
  </span>
  <span id="ctxWarn"></span>
  <div class="spacer"></div>
  <span class="btngrp"><i>本地操作</i>
   <button class="obtn" id="btnImport" title="从 JSON 导入（覆盖当前数据）">导入</button>
   <button class="obtn" id="btnExport" title="导出为 JSON 文件">导出</button>
  </span>
  <span class="vsep"></span>
  <span class="btngrp"><i>远程操作</i>
   <input id="mBase" placeholder="同步服务器地址" title="REST 同步服务地址，默认 http://119.80.252.20:5173">
   <button class="obtn" id="btnSave" title="保存当前知识图谱到服务器">保存</button>
   <button class="obtn" id="btnSync" title="从服务器拉取数据">同步</button>
   <button class="obtn" id="btnAuto" title="开启自动同步（每 25 秒拉取一次）">自动同步</button>
   <span id="syncSt" class="off">⚠ 离线模式</span>
  </span>
  <span class="vsep"></span>
  <button class="obtn" id="btnReset" title="重置为内置知识库">重置</button>
  <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
 </div>
 <div id="toolbar">
  <span class="logo"><span class="cube">KG</span>通信载荷知识结构化管理工作台</span>
  <div class="tabs" id="tabs">
   <button data-v="comp" class="on">组成网络</button>
   <button data-v="unit">单机连接</button>
   <button data-v="coup">属性耦合</button>
   <button data-v="g3d">3D 视图</button>
   <button data-v="dsm">DSM 矩阵</button>
   <button data-v="chain">链路流程</button>
  </div>
  <span id="pathBox"><i>PATH</i><span id="pathTxt">—</span></span>
  <div class="spacer"></div>
  <input id="search" type="search" placeholder="搜索本体 / 属性 / 符号…">
 </div>
 <div id="main">
  <div id="left">
   <div class="pane-h"><b>本体树</b><span class="cnt" id="treeCnt"></span></div>
   <div class="scroll" id="tree"></div>
  </div>
  <div id="center">
   <div id="viewWrap">
    <canvas class="view" id="cv"></canvas>
    <div id="chainView" style="display:none"></div>
    <div id="dsmView" style="display:none"></div>
     <div id="viewTools"></div>
    <div id="linkInd">点击节点联动左右面板</div>
    <div id="legend"></div>
    <div id="zoomBox"><button id="zIn" title="放大">＋</button><button id="zOut" title="缩小">－</button><button id="zFit" title="重置视图与自动布局">⤢</button></div>
    <div id="viewHint"></div>
    <div id="tooltip"></div>
   </div>
  </div>
  <div id="right">
   <div class="pane-h"><b>详情 / 属性 / 约束</b><span class="cnt" id="rightCnt"></span></div>
   <div class="scroll" id="detail"></div>
  </div>
 </div>
 <div id="status">
  <span class="g">● 知识库已就绪</span><span>|</span>
  <span>本体 <b id="stOnt">0</b></span>
  <span>属性 <b id="stAttr">0</b></span>
  <span>约束 <b id="stCst">0</b></span>
  <span>关系 <b id="stRel">0</b></span><span>|</span>
  <span class="path" id="stPath">—</span>
  <span style="margin-left:auto" id="stVer"></span>
 </div>
</div>
<div id="mask"><div class="modal" id="modalBox"></div></div>

<script>

}
function delAttr(id) {
  /* 只处理“原本包含该属性”的约束：单属性门限约束（如 I_trp >= 80 dB）不应被顺带删除 */
  const affected = DB.constraints.filter((c) => (c.members || []).some((m) => m.attributeId === id));
  const before = affected.length;
  DB.attributes = DB.attributes.filter((a) => a.id !== id);
  affected.forEach((c) => (c.members = c.members.filter((m) => m.attributeId !== id)));
  const dead = affected.filter((c) => c.members.length < 2);
  DB.constraints = DB.constraints.filter((c) => !dead.includes(c));
  const gone = dead.length;
  save(); refreshAll();
  if (gone) toast("已删除属性，同时移除 " + gone + " 条成员不足 2 个的约束", "err");
}
function addCons(formula, desc, members) { const c = { id: uid("con"), formula, description: desc || "", members }; DB.constraints.push(c); save(); refreshAll(); return c.id; }
function updCons(id, patch) { const c = DB.constraints.find((x) => x.id === id); if (c) Object.assign(c, patch); save(); refreshAll(); }
function delCons(id) { DB.constraints = DB.constraints.filter((c) => c.id !== id); save(); refreshAll(); }

/* ---------- 导入 / 导出 ---------- */
function exportText() { return JSON.stringify(Object.assign({}, DB, { exportedAt: new Date().toISOString() }), null, 2); }
function exportJSON() {
  const blob = new Blob([exportText()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (META.proj || "通信有效载荷知识图谱") + "_导出.json";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("已导出 JSON");
}
function importJSON(text, quiet) {
  try {
    const d = JSON.parse(text);
    if (!d || !Array.isArray(d.ontologies)) { toast("导入失败：缺少 ontologies 数组", "err"); return false; }
    DB = normalize(d); S.sel = rootId(); S.hlAttr = null; S.expanded = new Set(DB.ontologies.map((o) => o.id));
    save(); refreshAll();
    if (!quiet) toast("导入成功：" + DB.ontologies.length + " 本体 / " + DB.attributes.length + " 属性", "ok");
    return true;
  } catch (e) { toast("导入失败：" + e.message, "err"); return false; }
}

/* ---------- 本体树 ---------- */
function renderTree() {
  const q = S.q.trim().toLowerCase();
  const hit = (o) => q && (o.name.toLowerCase().includes(q) || o.id.toLowerCase().includes(q));
  function row(o, depth) {
    const kids = childrenOf(o.id);
    const open = S.expanded.has(o.id);
    const na = attrsOf(o.id).length;
    return '<div class="tnode">' +
      '<div class="trow' + (S.sel === o.id ? " sel" : "") + (hit(o) ? " hit" : "") + '" data-id="' + o.id + '" style="padding-left:' + (6 + depth * 13) + 'px">' +
      '<span class="car' + (open && kids.length ? " open" : "") + '" data-car="' + o.id + '">' + (kids.length ? "▶" : "") + "</span>" +
      '<span class="dot" style="background:' + (CATC[o.category] || "#94A3B8") + '"></span>' +
      '<span class="nm" title="' + esc(o.name) + " (" + esc(o.id) + ')">' + esc(o.name) + "</span>" +
      (na ? '<span class="bdg">' + na + "</span>" : "") +
      '<span class="ops"><button data-op="add" data-id="' + o.id + '" title="添加子本体">＋</button>' +
      '<button data-op="edit" data-id="' + o.id + '" title="编辑">✎</button>' +
      '<button data-op="del" data-id="' + o.id + '" title="删除子树">✕</button></span></div>' +
      (open ? kids.map((k) => row(k, depth + 1)).join("") : "") + "</div>";
  }
  const r = rootId();
  $("#tree").innerHTML = r ? row(ontMap()[r], 0) : '<div class="empty">空知识库，请导入 JSON</div>';
  $("#treeCnt").textContent = DB.ontologies.length + " 本体";
}
$("#tree").addEventListener("click", (e) => {
  const op = e.target.closest("[data-op]");
  if (op) {
    const id = op.dataset.id;
    if (op.dataset.op === "add") modalOnt(null, id);
    else if (op.dataset.op === "edit") modalOnt(id, null);
    else if (op.dataset.op === "del") { const o = ontMap()[id]; if (confirm("删除「" + o.name + "」及其子树、相关属性与约束？")) delOnt(id); }
    e.stopPropagation(); return;
  }
  const car = e.target.closest("[data-car]");
  if (car && car.textContent) { const id = car.dataset.car; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); save(); renderTree(); return; }
  const tr = e.target.closest(".trow");
  if (tr) { S.sel = tr.dataset.id; S.hlAttr = null; save(); renderTree(); renderDetail(); renderStatus(); drawView(); }
});

  if (rels.length) {

      rels.slice(0, 40).map((r) => { const other = r.from === o.id ? r.to : r.from; const dir = r.from === o.id ? "→" : "←"; return '<div class="arow" data-selrow="' + esc(other) + '"><div class="l1"><b style="font-weight:400">' + dir + " " + esc(r.type) + " · " + esc((m[other] || {}).name || other) + "</b></div></div>"; }).join("") +

$("#detail").addEventListener("click", (e) => {
  const mk = e.target.closest("[data-mk]");
  if (mk) { mk.dataset.mk === "attr" ? modalAttr(null, S.sel) : modalCons(null, S.sel); return; }
  const aop = e.target.closest("[data-aop]");
  if (aop) { aop.dataset.aop === "edit" ? modalAttr(aop.dataset.id, null) : (confirm("删除该属性？") && delAttr(aop.dataset.id)); e.stopPropagation(); return; }
  const cop = e.target.closest("[data-cop]");

  const aj = e.target.closest("[data-attrjump]");
  if (aj) { const a = DB.attributes.find((x) => x.id === aj.dataset.attrjump); if (a) { S.sel = a.ontologyId; S.hlAttr = a.id; save(); renderTree(); renderDetail(); renderStatus(); setView("coup"); } return; }

});

/* ---------- 模态框 ---------- */
function modalOnt(id, parentId) {
  const o = id ? ontMap()[id] : null;
  const cats = Object.keys(CATC).map((c) => '<option value="' + c + '"' + (o && o.category === c ? " selected" : "") + ">" + c + "</option>").join("");
  const parents = ont().map((x) => '<option value="' + x.id + '"' + ((o ? o.parentId : parentId) === x.id ? " selected" : "") + ">" + esc(x.name) + "</option>").join("");
  openModal('<h4>' + (o ? "编辑本体" : "新增本体") + '<button class="x" onclick="closeModal()">×</button></h4><div class="mb">' +
    '<div class="fld"><label>名称</label><input id="fName" value="' + esc(o ? o.name : "") + '"></div>' +
    '<div class="fld"><label>类别</label><select id="fCat">' + cats + '</select></div>' +
    '<div class="fld"><label>父本体</label><select id="fParent"><option value="">（根）</option>' + parents + '</select></div>' +
    '<div class="fld"><label>描述</label><textarea id="fDesc" rows="4">' + esc(o ? o.description : "") + '</textarea></div></div>' +
    '<div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" id="fOk">保存</button></div>');

    const patch = { name, category: $("#fCat").value, parentId: $("#fParent").value || null, description: $("#fDesc").value.trim() };
    if (o) { if (patch.parentId && subtreeIds(o.id).includes(patch.parentId)) { toast("父本体不能位于自身子树内"); return; } updOnt(o.id, patch); }
    else { const nid = addOnt(name, patch.description, patch.parentId || rootId(), patch.category); S.sel = nid; save(); renderTree(); renderDetail(); }
    closeModal();
  };
}
function modalAttr(id, ontId) {
  const a = id ? DB.attributes.find((x) => x.id === id) : null;
  openModal('<h4>' + (a ? "编辑属性" : "新增属性") + '<button class="x" onclick="closeModal()">×</button></h4><div class="mb">' +
    '<div class="fld"><label>名称</label><input id="fName" value="' + esc(a ? a.name : "") + '"></div>' +
    '<div class="fld"><label>符号 symbol</label><input id="fSym" value="' + esc(a ? a.symbol : "") + '" placeholder="如 G_ant、C_dsw"></div>' +
    '<div class="fld"><label>描述</label><textarea id="fDesc" rows="3">' + esc(a ? a.description : "") + '</textarea></div></div>' +
    '<div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" id="fOk">保存</button></div>');
  $("#fOk").onclick = () => {
    const name = $("#fName").value.trim(); if (!name) { toast("名称不能为空"); return; }
    if (a) updAttr(a.id, { name, symbol: $("#fSym").value.trim(), description: $("#fDesc").value.trim() });
    else addAttr(ontId, name, $("#fDesc").value.trim(), $("#fSym").value.trim());
    closeModal();
  };
}
function modalCons(id, ontId) {
  const c = id ? DB.constraints.find((x) => x.id === id) : null;
  let members = c ? c.members.map((m) => ({ attributeId: m.attributeId, role: m.role })) : [];
  const host = () => ontId || S.sel || rootId();
  let inOpen = false;
  function inlineBox() {
    const h = host(), hn = (ontMap()[h] || {}).name || h || "（根）";
    return '<div id="mInlineBox" style="display:' + (inOpen ? "block" : "none") + ';margin-top:8px;border:1px dashed var(--line2);border-radius:7px;padding:8px;background:#0E1728">' +
      '<div style="font-size:11px;color:var(--dim);margin-bottom:6px">就地新建属性 → 挂到本体：<b style="color:var(--cyan2)">' + esc(hn) + "</b>（" + esc(h || "") + "）</div>" +
      '<div style="display:flex;gap:6px;align-items:center"><input id="inName" placeholder="属性名称" style="flex:1">' +
      '<input id="inSym" placeholder="符号 如 G_ant" style="width:132px">' +
      '<button class="btn pri" id="inOk">创建并加入</button></div>' +
      '<div style="font-size:10.5px;color:var(--dim2);margin-top:5px">符号留空时按名称自动生成；创建后立即作为成员加入本约束，角色默认取符号。</div></div>';
  }
  const optAll = () => ont().map((o) => attrsOf(o.id).map((a) => '<option value="' + a.id + '">' + esc(ancestors(o.id).map((x) => x.name).join("/") + "." + a.name) + "</option>").join("")).join("");
  function rows() {
    return members.map((m, i) => '<div class="mrow"><select data-mi="' + i + '"><option value="">选择属性…</option>' +
      ont().map((o) => attrsOf(o.id).map((a) => '<option value="' + a.id + '"' + (a.id === m.attributeId ? " selected" : "") + ">" + esc(a.name + "（" + o.name + "）") + "</option>").join("")).join("") +
      '</select><input data-mr="' + i + '" placeholder="角色 如 G_ant" value="' + esc(m.role) + '"><button data-md="' + i + '">✕</button></div>').join("");
  }
  function paint() {
    $("#mBody").innerHTML = '<div class="fld"><label>公式 formula</label><input id="fFormula" value="' + esc(c ? c.formula : "") + '" placeholder="如 EIRP = P_out + G_ant − L_feed"></div>' +
      '<div class="fld"><label>描述</label><textarea id="fDesc" rows="3">' + esc(c ? c.description : "") + '</textarea></div>' +
      '<div class="fld"><label>成员（属性 + 角色）</label><div id="mRows" style="display:flex;flex-direction:column;gap:6px">' + rows() + "</div>" +
      '<div style="display:flex;gap:8px;margin-top:6px"><button class="btn" id="mAdd">＋ 成员</button>' +
      '<button class="btn" id="mInline">＋ 就地新建属性并加入</button></div>' + inlineBox() + "</div>";
    $("#mRows").addEventListener("change", (e) => {
      const i = e.target.dataset.mi != null ? +e.target.dataset.mi : e.target.dataset.mr != null ? +e.target.dataset.mr : null;
      if (i == null) return;
      if (e.target.dataset.mi != null) members[i].attributeId = e.target.value; else members[i].role = e.target.value;
    });
    $("#mRows").addEventListener("click", (e) => { const d = e.target.closest("[data-md]"); if (d) { members.splice(+d.dataset.md, 1); paint(); } });
    $("#mAdd").onclick = () => { members.push({ attributeId: "", role: "" }); paint(); };
    $("#mInline").onclick = () => { inOpen = !inOpen; paint(); if (inOpen) { const n = $("#inName"); if (n) n.focus(); } };
    const iok = $("#inOk"); if (iok) iok.onclick = () => {
      const nm = ($("#inName").value || "").trim();
      if (!nm) { toast("属性名称不能为空", "err"); return; }
      const sym = ($("#inSym").value || "").trim() || symFallback(nm);
      const aid = addAttr(host(), nm, "", sym);
      members.push({ attributeId: aid, role: sym });
      inOpen = false; paint(); toast("已新建属性 " + nm + "（" + sym + "）并加入成员", "ok");
    };
  }
  openModal('<h4>' + (c ? "编辑约束" : "新增约束") + '<button class="x" onclick="closeModal()">×</button></h4><div class="mb" id="mBody"></div>' +
    '<div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" id="fOk">保存</button></div>');
  paint();
  $("#fOk").onclick = () => {
    const formula = $("#fFormula").value.trim(); if (!formula) { toast("公式不能为空"); return; }
    const ms = members.filter((m) => m.attributeId);
    if (!ms.length) { toast("至少需要一个成员"); return; }
    if (c) updCons(c.id, { formula, description: $("#fDesc").value.trim(), members: ms });
    else addCons(formula, $("#fDesc").value.trim(), ms);
    closeModal();
  };
}

/* ---------- 远程同步：REST GET/POST {base}/api/kg?user=&project=&file= ---------- */
const DEF_BASE = "http://119.80.252.20:5173";
const SYNC = {
  base: (function () { try { return localStorage.getItem("plkgwb.syncbase") || DEF_BASE; } catch (e) { return DEF_BASE; } })(),
  tpl: "{user}/{project}/{file}", auto: false, timer: null, busy: "", ok: false, last: null,
};
function ctxReady() { return !!(String(META.user || "").trim() && String(META.proj || "").trim() && String(META.file || "").trim()); }
function syncURL() {
  const q = new URLSearchParams({ user: String(META.user || "").trim(), project: String(META.proj || "").trim(), file: String(META.file || "").trim() });
  return String(SYNC.base || DEF_BASE).replace(/\/+$/, "") + "/api/kg?" + q.toString();
}
function fetchTO(url, opt) {
  const o = Object.assign({ cache: "no-store" }, opt || {});
  try { if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) o.signal = AbortSignal.timeout(9000); } catch (e) {}
  return fetch(url, o);
}
function syncStatusText() {
  const el = $("#syncSt"); if (!el) return;
  let kind, txt;
  if (SYNC.busy === "pull") { kind = "busy"; txt = '<span class="spi">◐</span> 同步中…'; }
  else if (SYNC.busy === "save") { kind = "busy"; txt = '<span class="spi">◐</span> 保存中…'; }
  else if (SYNC.ok && SYNC.last) { kind = "ok"; txt = "✔ 已同步 " + new Date(SYNC.last).toLocaleTimeString("zh-CN"); }
  else if (SYNC.ok) { kind = "ok"; txt = "✔ 已连接"; }
  else { kind = "off"; txt = "⚠ 离线模式"; }
  el.className = kind; el.innerHTML = txt;
  el.title = SYNC.ok ? ("服务地址 " + SYNC.base + " ・ 路径模板 " + SYNC.tpl) : ("未连接到 " + SYNC.base);
  const ready = ctxReady();
  ["#btnSave", "#btnSync", "#btnAuto"].forEach((k) => { const b = $(k); if (b) b.disabled = !ready || (SYNC.busy !== "" && k !== "#btnAuto"); });
  const w = $("#ctxWarn"); if (w) w.textContent = ready ? "" : "请填写用户名 / 项目名 / 文件名后才能同步";
}
function dbSig(d) { try { return JSON.stringify([d.ontologies, d.attributes, d.constraints, d.relations || []]); } catch (e) { return ""; } }
async function syncPull(silent) {
  if (!ctxReady()) { if (!silent) toast("请先填写用户名 / 项目名 / 文件名", "err"); syncStatusText(); return false; }
  SYNC.busy = "pull"; syncStatusText();
  try {
    const res = await fetchTO(syncURL());
    if (!res.ok) throw new Error(res.status === 404 ? "文件不存在（404）" : "HTTP " + res.status);

/* ============ part4：3D 布局模式（10 种）· 纯坐标计算，无外部依赖，离线可用 ============ */
const LAY3D = [
  { mode: null, label: "自由" },
  { mode: "tiered", label: "层级环" },
  { mode: "td", label: "向下" },
  { mode: "bu", label: "向上" },
  { mode: "lr", label: "左→右" },
  { mode: "rl", label: "右→左" },
  { mode: "zout", label: "向外" },
  { mode: "zin", label: "向内" },
  { mode: "radialout", label: "辐射" },
  { mode: "radialin", label: "向心" }
];

const applyLayout3D = (function () {
  const LXY = 620, LZ = 430;
  const GA = Math.PI * (3 - Math.sqrt(5));

  function clamp(v, lim) {
    const n = Number(v);
    if (!isFinite(n)) return 0;
    return n < -lim ? -lim : (n > lim ? lim : n);
  }

  /* BFS 分层：优先 hier 边，退化时依次用关系边 / 全部边；层内按分系统+标签+id 稳定排序 */
  function layersOf(g) {
    const ids = new Set(g.nodes.map((n) => n.id));
    const inc = {}, adj = {};
    g.nodes.forEach((n) => { inc[n.id] = 0; adj[n.id] = []; });
    const ok = (e) => ids.has(e.a) && ids.has(e.b) && e.a !== e.b;
    /* 用全部有效边分层：属性靠 own 边、约束靠 cons 边挂接，
       只看 hier 会把它们误判成第 0 层的“根”。结构边优先入队以稳定层级。 */
    const PRIO = { hier: 0, own: 1, cons: 2, chain: 3, uchain: 3, rel: 4, urel: 4, agg: 4, coup: 5 };
    const es = g.edges.filter(ok).slice().sort((p, q) => {
      const a = PRIO[p.t] === undefined ? 6 : PRIO[p.t], b = PRIO[q.t] === undefined ? 6 : PRIO[q.t];
      return a - b;
    });
    es.forEach((e) => { inc[e.b] = (inc[e.b] || 0) + 1; adj[e.a].push(e.b); });
    const depth = {}, order = [];
    g.nodes.forEach((n) => { if (!inc[n.id]) { depth[n.id] = 0; order.push(n.id); } });
    if (!order.length && g.nodes.length) { depth[g.nodes[0].id] = 0; order.push(g.nodes[0].id); }
    for (let h = 0; h < order.length; h++) {
      const cur = order[h];
      (adj[cur] || []).forEach((b) => { if (depth[b] === undefined) { depth[b] = depth[cur] + 1; order.push(b); } });
    }
    let maxD = 0;
    g.nodes.forEach((n) => { if (depth[n.id] !== undefined && depth[n.id] > maxD) maxD = depth[n.id]; });
    g.nodes.forEach((n) => { if (depth[n.id] === undefined) depth[n.id] = maxD + 1; });
    const buckets = [];
    for (let d = 0; d <= maxD + 1; d++) buckets.push([]);
    g.nodes.forEach((n) => buckets[depth[n.id]].push(n));
    const out = buckets.filter((a) => a.length);
    const sv = (v) => String(v === null || v === undefined ? "" : v);
    out.forEach((a) => a.sort((p, q) => {
      const s1 = sv(p.sub), s2 = sv(q.sub);
      if (s1 !== s2) return s1 < s2 ? -1 : 1;
      const l1 = sv(p.label), l2 = sv(q.label);
      if (l1 !== l2) return l1 < l2 ? -1 : 1;
      const i1 = sv(p.id), i2 = sv(q.id);
      return i1 < i2 ? -1 : (i1 > i2 ? 1 : 0);
    }));
    return out;
  }

  function grid(count, aspect) {
    const cols = Math.max(1, Math.ceil(Math.sqrt(Math.max(1, count) * aspect)));
    return { cols: cols, rows: Math.max(1, Math.ceil(count / cols)) };
  }

  /* 计算原始坐标（未归一化） */
  function place(mode, g) {
    const layers = layersOf(g), NL = layers.length, raw = {};
    if (!NL) return raw;
    const mid = (NL - 1) / 2;
    const put = (n, x, y, z) => { raw[n.id] = { x: x, y: y, z: z }; };

    if (mode === "tiered") {
      layers.forEach((arr, i) => {
        const y = (i - mid) * 178;
        if (arr.length === 1) { put(arr[0], 0, y, 0); return; }
        const r = Math.max(72, arr.length * 11.6);
        arr.forEach((n, j) => {
          const a = (2 * Math.PI * j) / arr.length + i * 0.42;
          put(n, Math.cos(a) * r, y, Math.sin(a) * r);
        });
      });
      return raw;
    }

    if (mode === "radialout" || mode === "radialin") {
      const inv = mode === "radialin";
      layers.forEach((arr, i) => {
        const t = NL === 1 ? 1 : ((inv ? (NL - 1 - i) : i) / (NL - 1));
        let R = 300 * t;
        if (R < 1) R = arr.length > 1 ? 72 : 0;
        if (R === 0) { arr.forEach((n) => put(n, 0, 0, 0)); return; }
        arr.forEach((n, j) => {
          const yy = arr.length === 1 ? 0 : 1 - (2 * (j + 0.5)) / arr.length;
          const rr = Math.sqrt(Math.max(0, 1 - yy * yy));
          const th = GA * j + i * 0.7;
          put(n, Math.cos(th) * rr * R, yy * R, Math.sin(th) * rr * R);
        });
      });
      return raw;
    }

    const LH = 188, LW = 215, LZS = 168;
    layers.forEach((arr, i) => {
      const count = arr.length;
      if (mode === "td" || mode === "bu") {
        const sgn = mode === "td" ? 1 : -1;
        const y = sgn * (i - mid) * LH, gr = grid(count, 2.2);
        arr.forEach((n, j) => {
          const c = j % gr.cols, r = Math.floor(j / gr.cols);
          put(n, (c - (gr.cols - 1) / 2) * 102, y, (r - (gr.rows - 1) / 2) * 80);
        });
      } else if (mode === "lr" || mode === "rl") {
        const sgn = mode === "lr" ? 1 : -1;
        const x = sgn * (i - mid) * LW, gr = grid(count, 2.6);
        arr.forEach((n, j) => {
          const c = j % gr.cols, r = Math.floor(j / gr.cols);
          put(n, x, (c - (gr.cols - 1) / 2) * 94, (r - (gr.rows - 1) / 2) * 80);
        });
      } else {
        const sgn = mode === "zin" ? -1 : 1;
        const z = sgn * (i - mid) * LZS, gr = grid(count, 1.35);
        arr.forEach((n, j) => {
          const c = j % gr.cols, r = Math.floor(j / gr.cols);
          put(n, (c - (gr.cols - 1) / 2) * 102, (r - (gr.rows - 1) / 2) * 90, z);
        });
      }
    });
    return raw;
  }

  /* 去质心 + 统一缩放到安全范围，保证投影 f=900/(900+z) 不发散 */
  function fit(raw) {
    const ks = Object.keys(raw);
    if (!ks.length) return raw;
    let cx = 0, cy = 0, cz = 0;
    ks.forEach((k) => { cx += raw[k].x; cy += raw[k].y; cz += raw[k].z; });
    cx /= ks.length; cy /= ks.length; cz /= ks.length;
    let ex = 1e-6, ey = 1e-6, ez = 1e-6;
    ks.forEach((k) => {
      const p = raw[k];
      ex = Math.max(ex, Math.abs(p.x - cx));
      ey = Math.max(ey, Math.abs(p.y - cy));
      ez = Math.max(ez, Math.abs(p.z - cz));
    });
    const s = Math.min(LXY / ex, LXY / ey, LZ / ez);
    ks.forEach((k) => { const p = raw[k]; p.x = (p.x - cx) * s; p.y = (p.y - cy) * s; p.z = (p.z - cz) * s; });
    return raw;
  }

  const KNOWN = { tiered: 1, td: 1, bu: 1, lr: 1, rl: 1, zout: 1, zin: 1, radialout: 1, radialin: 1 };

  return function applyLayout3D(mode, g, M) {
    if (!g || !g.nodes || !g.nodes.length || !M || typeof M.get !== "function") return;
    if (mode === null || mode === undefined || mode === "") return;
    const use = KNOWN[mode] ? mode : "tiered";
    let raw;
    try { raw = fit(place(use, g)); } catch (e) { return; }
    g.nodes.forEach((n) => {
      const p = M.get(n.id);
      if (!p) return;
      const q = raw[n.id];
      if (!q) return;
      p.x = clamp(q.x, LXY); p.y = clamp(q.y, LXY); p.z = clamp(q.z, LZ);
      p.vx = 0; p.vy = 0; p.vz = 0;
    });
  };
})();
/* ================= 视图层：组成网络 / 单机连接 / 属性耦合 / 3D / DSM / 链路 ================= */
const POS = new Map(), POS3 = new Map();
let G = null, T = { k: 1, x: 0, y: 0 }, hover = null, dragN = null, panning = null, rotating = null;
let YAW = 0.6, PITCH = 0.35, Z3 = 1;
const cv = $("#cv"), ctx = cv.getContext("2d");
const tip = $("#tooltip");
if (S.focusOn === undefined) S.focusOn = false;
if (S.mode3d === undefined) S.mode3d = null;
if (S.labels3d === undefined) S.labels3d = false;

function subsysOf(id) { const m = ontMap(); let c = m[id], p = c && c.parentId ? m[c.parentId] : null; while (p && p.parentId && p.parentId !== rootId()) { c = p; p = m[p.parentId]; } return c ? (p && p.parentId === rootId() ? c.id : (p ? p.id : c.id)) : id; }
function catR(cat) { return cat === "载荷总体" ? 20 : cat === "分系统" ? 15 : cat === "分组" ? 9 : cat === "体制" ? 10 : cat === "链路" ? 9 : cat === "指标" ? 8 : cat === "硬件" ? 9 : cat === "软件" ? 9 : cat === "接口" ? 8 : 7; }
const SUBC = { ant_subsys: "#60A5FA", trp_subsys: "#FBBF24", laser_subsys: "#34D399", pcu_subsys: "#A78BFA", comm_payload: "#38BDF8" };
/* 单机间关系类型配色 */
const RELC = {

  "存储访问": "#2DD4BF", "供电": "#F87171", "接口实现": "#FDE047", "外部接口": "#FB923C",

};

/* 知识图谱层级模式：组成网络/单机连接 + 层级布局时，采用盒状分层 + 约束底带 */
function kgMode() { return S.layout === "tiered" && (S.view === "comp" || S.view === "unit"); }
/* ---------- 组成网络（可叠加属性 / 约束） ---------- */
function compGraph() {
  const sc = scopeIds(), m = ontMap(), kg = kgMode();
  const nodes = ont().filter((o) => !sc || sc.has(o.id)).map((o) => ({ id: o.id, label: o.name, cat: o.category, kind: "ont", sub: subsysOf(o.id), r: catR(o.category), desc: o.description || "" }));
  const ids = new Set(nodes.map((n) => n.id));
  const edges = [];
  nodes.forEach((n) => { const o = m[n.id]; if (o.parentId && ids.has(o.parentId)) edges.push({ a: o.parentId, b: n.id, t: "hier" }); });
  ont().forEach((o) => { if (!o.chain || !ids.has(o.id)) return; for (let i = 0; i < o.chain.length - 1; i++) if (ids.has(o.chain[i]) && ids.has(o.chain[i + 1])) edges.push({ a: o.chain[i], b: o.chain[i + 1], t: "chain", src: o.id }); });
  if (S.showRel && !kg) (DB.relations || []).forEach((r) => { if (r.type === "体制组成单机" || r.type === "链路组成单机") return; if (ids.has(r.from) && ids.has(r.to)) edges.push({ a: r.from, b: r.to, t: "rel", label: r.type }); });
  const inCons = new Set();
  if (S.showCons) (DB.constraints || []).forEach((c) => (c.members || []).forEach((x) => inCons.add(x.attributeId)));
  const attrOwner = {};
  DB.attributes.forEach((a) => (attrOwner[a.id] = a.ontologyId));
  const aIds = new Set();
  if (!kg) DB.attributes.forEach((a) => {
    if (!ids.has(a.ontologyId)) return;
    if (!S.showAttr && !(S.showCons && inCons.has(a.id))) return;
    const aid = "a:" + a.id; aIds.add(a.id);
    nodes.push({ id: aid, label: a.symbol || a.name, cat: "属性", kind: "attr", attrId: a.id, ref: a.id, ont: a.ontologyId, sub: subsysOf(a.ontologyId), r: 4.4, desc: a.name + (a.description ? " ・ " + a.description : "") });
    edges.push({ a: a.ontologyId, b: aid, t: "own" });
  });
  if (S.showCons) (DB.constraints || []).forEach((c) => {
    const ms = (c.members || []).filter((x) => aIds.has(x.attributeId) || (kg && attrOwner[x.attributeId] && ids.has(attrOwner[x.attributeId])));
    if (!ms.length) return;   /* 单属性门限约束（如 I_trp >= 80 dB）同样要画出来 */
    const cid = "c:" + c.id;
    nodes.push({ id: cid, label: c.formula || c.name || c.id, cat: "约束", kind: "cons", consId: c.id, sub: "cons", band: !!kg, r: 9, desc: (c.description || "") + " ・ " + ms.length + " 个属性成员" });
    if (kg) {
      const seenO = new Set();
      ms.forEach((x) => { const ow = attrOwner[x.attributeId]; if (ow && ids.has(ow) && !seenO.has(ow)) { seenO.add(ow); edges.push({ a: ow, b: cid, t: "cons", label: x.role }); } });
    } else ms.forEach((x) => edges.push({ a: "a:" + x.attributeId, b: cid, t: "cons", label: x.role }));
  });
  return { nodes, edges };
}
/* ---------- 属性耦合 ---------- */
function coupGraph() {
  const sc = scopeIds();
  const attrs = DB.attributes.filter((a) => { const o = ontMap()[a.ontologyId]; return o && (!sc || sc.has(o.id)); });
  const ids = new Set(attrs.map((a) => a.id));
  const deg = {}, em = {};
  DB.constraints.forEach((c) => {
    const ms = c.members.filter((m) => ids.has(m.attributeId));
    for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++) {
      const k = [ms[i].attributeId, ms[j].attributeId].sort().join("|");
      (em[k] = em[k] || { a: k.split("|")[0], b: k.split("|")[1], t: "coup", cs: [] }).cs.push(c.id);
      deg[ms[i].attributeId] = (deg[ms[i].attributeId] || 0) + 1; deg[ms[j].attributeId] = (deg[ms[j].attributeId] || 0) + 1;
    }
  });
  const nodes = attrs.map((a) => ({ id: a.id, label: a.name, cat: "属性", kind: "attr", attrId: a.id, ref: a.id, ont: a.ontologyId, sub: subsysOf(a.ontologyId), r: 5 + Math.min(9, (deg[a.id] || 0) * 1.1), desc: (a.symbol ? a.symbol + " ← " : "") + (a.description || "") }));
  return { nodes, edges: Object.values(em) };
}
/* ---------- 单机连接关系图（新增视图） ---------- */
function unitGraph() {
  const sc = scopeIds(), m = ontMap();
  const units = ont().filter((o) => o.category === "单机" && (!sc || sc.has(o.id)));
  const ids = new Set(units.map((o) => o.id));
  const nodes = units.map((o) => ({ id: o.id, label: o.name, cat: "单机", kind: "unit", sub: subsysOf(o.id), r: 12, desc: o.description || "" }));
  const edges = [], seen = new Set();
  (DB.relations || []).forEach((r) => {
    if (!ids.has(r.from) || !ids.has(r.to) || r.from === r.to) return;
    const k = r.from + "|" + r.to + "|" + r.type; if (seen.has(k)) return; seen.add(k);
    edges.push({ a: r.from, b: r.to, t: "urel", rt: r.type, label: r.type, desc: r.description || "" });
  });

    for (let i = 0; i < o.chain.length - 1; i++) {
      const A = o.chain[i], B = o.chain[i + 1];
      if (!ids.has(A) || !ids.has(B) || A === B) continue;
      const k = "ch|" + A + "|" + B; if (seen.has(k)) continue; seen.add(k);
      edges.push({ a: A, b: B, t: "uchain", label: (m[o.id] || {}).name || o.id, src: o.id, desc: "同属 " + ((m[o.id] || {}).name || o.id) + " 的相邻环节" });
    }

/* ---------- 3D 数据源之一：分系统 / 分组 / 体制 之间的关系（把单机层关系聚合上来） ---------- */
function groupGraph() {
  const m = ontMap(), r0 = rootId(), sc = scopeIds();
  const keep = new Set();
  ont().forEach((o) => {
    if (sc && !sc.has(o.id)) return;
    if (o.id === r0 || o.category === "分系统" || o.category === "分组" || o.category === "体制") keep.add(o.id);
  });
  const upTo = (id) => { let c = m[id]; while (c && c.parentId && !keep.has(c.id)) c = m[c.parentId]; return c && keep.has(c.id) ? c.id : null; };
  const un = {};
  ont().forEach((o) => { if (o.category !== "单机") return; const t = upTo(o.id); if (t) un[t] = (un[t] || 0) + 1; });

  if (n) {

    tip.innerHTML = '<div class="tt">' + esc(n.label) + '</div><div class="td">' + esc((n.desc || "").slice(0, 130)) + '</div><div class="tm">' + esc(kindTxt) + " ・ " + esc(n.attrId || n.consId || n.id) + (n.ont ? " @ " + esc(n.ont) : "") + "</div>";
    tip.style.display = "block";
    const wr = $("#viewWrap").getBoundingClientRect();
    tip.style.left = Math.min(wr.width - 340, e.clientX - wr.left + 14) + "px";
    tip.style.top = Math.min(wr.height - 90, e.clientY - wr.top + 12) + "px";
    cv.style.cursor = "pointer";
  } else { tip.style.display = "none"; cv.style.cursor = S.view === "g3d" ? "move" : "grab"; }
});
window.addEventListener("mouseup", (e) => {
  if (rotating) {
    const moved = Math.abs(e.clientX - rotating.x) + Math.abs(e.clientY - rotating.y);
    rotating = null;
    if (moved < 5 && G && lastProj) {
      const r = cv.getBoundingClientRect();
      selectNode(hitNode(e.clientX - r.left, e.clientY - r.top, G, null, (nn) => lastProj[nn.id]));
    }
    return;
  }
  if (dragN) selectNode(dragN);
  dragN = null; panning = null;
});
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  T.k = Math.max(.25, Math.min(3.5, T.k * f));
}, { passive: false });
window.addEventListener("resize", () => drawView());
/* ---- 主循环 ---- */
function frame() {
  const isCv = S.view === "comp" || S.view === "coup" || S.view === "g3d" || S.view === "unit";
  if (isCv) {
    if (!G) drawView();
    if (G) {
      const three = S.view === "g3d";
      if (G._hlSel !== S.sel || (S.hlRel ? !G.hl : !!G.hl)) { G.hl = S.hlRel ? hlSet(G, S.sel) : null; G._hlSel = S.sel; }
      if (!G.tiered) { simStep(G, three); simStep(G, three); }
      if (three && S.rot) YAW += 0.0035;   /* 3D 自转只动相机，布局模式下同样可用 */
      lastProj = {}; const rr = draw2D(G, three);
      G.nodes.forEach((n) => { const p = rr.proj(n); if (p) lastProj[n.id] = p; });
    }
  }
  requestAnimationFrame(frame);
}
/* ---- 启动 ---- */
function boot2() {
  S.sel = rootId(); S.expanded = new Set(ont().map((o) => o.id)); S.scope = "ALL"; G = null;
  S.hlAttr = null; S.focusOn = false; S.layout = "tiered"; S.showAttr = false; S.flow = true; S.mode3d = null; S.labels3d = false;
  S.hlRel = true; S.g3src = "unit"; S.unitLabels = true;
  POS.clear(); POS3.clear(); T = { k: 1, x: 0, y: 0 };
  $("#mUser").value = META.user || ""; $("#mProj").value = META.proj || "";
  const mf = $("#mFile"); if (mf) mf.value = META.file || "";
  refreshAll();
}
(function boot() {
  if (!loadPersist()) { DB = normalize(JSON.parse(JSON.stringify(SEED))); S.sel = rootId(); S.expanded = new Set(ont().map((o) => o.id)); }
  if (!S.sel || !ontMap()[S.sel]) S.sel = rootId();
  if (!S.expanded.size) S.expanded = new Set(ont().map((o) => o.id));
  $("#mUser").value = META.user || ""; $("#mProj").value = META.proj || "";
  const mf = $("#mFile"); if (mf && !mf.value) mf.value = META.file || "";
  refreshAll(); setView("comp");
  requestAnimationFrame(frame);
})();

</script>
